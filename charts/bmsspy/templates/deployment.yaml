apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "bmsspy.fullname" . }}
  labels:
    {{- include "bmsspy.labels" . | nindent 4 }}
spec:
  # Exactly one client may talk to the BMS: never two pods, not even during an update.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "bmsspy.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "bmsspy.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bmsspy
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: BMS_HOST
              value: {{ required "bms.host is required: the address of the BMS Wi-Fi module (TCP-server mode)" .Values.bms.host | quote }}
            - name: BMS_PORT
              value: {{ .Values.bms.port | quote }}
            - name: METRICS_PORT
              value: {{ .Values.metrics.port | quote }}
            - name: IDLE_TIMEOUT_SECONDS
              value: {{ .Values.idleTimeoutSeconds | quote }}
            - name: VERBOSE
              value: {{ ternary "1" "0" .Values.verbose | quote }}
          ports:
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
          # /healthz only reflects the process, not the BMS connection: an unreachable BMS must
          # not cause restarts (bms_connected and the alerts cover that).
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
